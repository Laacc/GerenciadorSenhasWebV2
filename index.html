<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Gerenciador de Senhas Web v0.2</title>
</head>
<body>
    <main class="container">
        <div class="row">
            <div class="col-lg-5 mx-auto">
                <section>
                    <h1>Gerenciador de Senhas</h1>
                    <form>
                        <div class="mb-3">
                            <label for="inputEmail" class="form-label">Email para login</label>
                            <input type="email" id="inputEmail" required placeholder="exemplo@email.com" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="inputSenha" class="form-label">Senha</label>
                            <input type="password" id="inputSenha" class="form-control" required placeholder="Digite a senha" minlength="6">
                        </div>

                        <div class="mb-3 d-grid gap-2 d-md-flex">
                            <button id="btnEntrar" class="btn btn-primary" type="submit">Entrar</button>
                            <button id="btnCriarConta" class="btn btn-primary" type="button">Criar Conta</button>
                        </div>
                    </form>
                </section>

                <section hidden>
                    <h2>Cofre</h2>
                    <div class="mb-3">
                        <label for="inputMestra" class="form-label">Senha Mestra</label>
                        <input type="password" id="inputMestra" class="form-control" autocomplete="off">

                        <div class="mb-3 d-grid">
                            <button id="btnDestravar" type="button" class="btn btn-primary">Destravar</button>
                        </div>
                        <small class="form-text">A senha mestra não é enviada ao servidor e não tem recuperação.</small>
                    </div>
                        <form id="formNovaSenha">
                            <h3 class="mt-4">Salvar nova senha</h3>
                            
                            <div class="mb-3">
                                <label for="inputPlataforma" class="form-label">Plataforma</label>
                                <input type="text" id="inputPlataforma" class="form-control" required autocomplete="off">
                            </div>

                            <div class="mb-3">
                                <label for="inputLoginSite" class="form-label">Login do Site</label>
                                <input type="text" id="inputLoginSite" class="form-control" required autocomplete="off">
                            </div>

                            <div class="mb-3">
                                <label for="inputSenhaSite" class="form-label">Senha Gerada</label>
                                <div class="input-group">
                                    <input type="text" id="inputSenhaSite" class="form-control" readonly required>
                                    <button id="btnGerar" type="button" class="btn btn-outline-primary">Gerar</button>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button id="btnSubmitNovaSenha" type="submit" class="btn btn-primary">Salvar Senha</button>
                            </div>
                        </form>

                        <h3 class="mt-4">Suas Senhas</h3>
                        <ul id="listaSenhas" class="list-group">
                            
                        </ul>
                        <p id="msgVazio" class="text-muted">Nenhuma senha salva ainda.</p>
                        <button id="btnSair" type="button" class="btn btn-outline-secondary">Sair</button>
                </section>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
