<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Gerenciador de Senhas Web v0.2</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <main class="container flex-grow-1">
        <div class="row">
            <div class="col-lg-5 mx-auto">
                <section id="telaLogin">
                    <h1>Gerenciador de Senhas</h1>
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="inputEmail" class="form-label">Email</label>
                            <input type="email" id="inputEmail" required placeholder="exemplo@email.com" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="inputSenha" class="form-label">Senha</label>
                            <input type="password" id="inputSenha" class="form-control" required placeholder="Digite a senha" minlength="6">
                        </div>

                        <div class="mb-3 d-grid gap-2 d-md-flex">
                            <button id="btnEntrar" class="btn btnGray" type="submit">Entrar</button>
                            <button id="btnCriarConta" class="btn btnGray" type="button">Criar Conta</button>
                        </div>
                    </form>
                </section>

                <section hidden id="telaCofre">
                    <h2>Cofre</h2>
                    <div class="mb-3">
                        <label for="inputMestra" class="form-label">Senha Mestra</label>
                        <input type="password" id="inputMestra" class="form-control" autocomplete="off">

                        <div class="mb-3 mt-3 d-grid">
                            <button id="btnDestravar" type="button" class="btn btnGray">Destravar</button>
                        </div>
                        <small class="form-text">A senha mestra não é enviada ao servidor e não tem recuperação.</small>
                    </div>
                        <form id="formNovaSenha">
                            <h3 class="mt-4">Salvar nova senha</h3>
                            
                            <div class="mb-3">
                                <label for="inputPlataforma" class="form-label">Plataforma</label>
                                <input type="text" id="inputPlataforma" class="form-control" required autocomplete="off" placeholder="Plataforma da senha">
                            </div>

                            <div class="mb-3">
                                <label for="inputLoginSite" class="form-label">Login do Site</label>
                                <input type="text" id="inputLoginSite" class="form-control" required autocomplete="off" placeholder="Nome de usuário ou e-mail da plataforma">
                            </div>

                            <div class="mb-3">
                                <label for="inputSenhaSite" class="form-label">Senha Gerada</label>
                                <div class="input-group">
                                    <input type="text" id="inputSenhaSite" class="form-control" readonly required placeholder="Senha gerada aparecerá aqui"">
                                    <button id="btnGerar" type="button" class="btn btn-outline-primary">Gerar</button>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button id="btnSubmitNovaSenha" type="submit" class="btn btn-primary">Salvar Senha</button>
                            </div>
                        </form>
                        <div id="msg"></div>
                        <h3 class="mt-4">Suas Senhas</h3>
                        <ul id="listaSenhas" class="list-group">
                            
                        </ul>
                        <p id="msgVazio" class="text-muted">Nenhuma senha salva ainda.</p>
                        <button id="btnSair" type="button" class="btn btn-outline-secondary mt-3">Sair</button>
                </section>

                <dialog id="dlgConfirmar">
                    <form method="dialog">
                        <p id="dlgTexto"></p>
                        <div class="d-flex justify-content-end gap-2">
                            <button value="nao" class="btn btn-outline-secondary">Cancelar</button>
                            <button value="sim" class="btn btn-outline-danger">Apagar</button>
                        </div>
                    </form>
                </dialog>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white-50 small text-center py-4 mt-auto">
        <div class="container d-flex justify-content-between align-items-center">
            <p class="mb-1">🔑Gerenciador de Senhas</p>
            <a href="https://github.com/Laacc/GerenciadorSenhasWebV2" target="_blank" rel="noopener noreferrer"class="btn btn-outline-light btn-sm">
            <i class="bi bi-github text-white-50">Repositório</i>
        </a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
